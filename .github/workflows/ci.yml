name: Go CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "sds-nbd"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"; echo "$files"; exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: zero-alloc data path gate (Phase 1)
        if: matrix.module == 'sds-nbd'
        run: go test -run TestNBDZeroAllocGate -count=1 -v ./nbd/
