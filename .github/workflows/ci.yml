name: Go CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"; echo "$files"; exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race)
        # -short skips the 100k-device CRUSH balance measurement, which
        # alone runs ~10 min under -race (past go test's 10m default);
        # TestHugeMapCompile keeps the compile path under the detector.
        # The timeout bump is headroom for the rest of the race suite.
        run: go test -race -short -count=1 -timeout 15m ./...
      - name: zero-alloc NBD data path gate (Phase 4)
        run: go test -run TestNBDZeroAllocGate -count=1 -v ./pkg/nbd/
      - name: zero-alloc cluster protocol gate (Phase 5)
        run: go test -run TestSDSNetZeroAllocGate -count=1 -v ./pkg/sdsnet/
      - name: zero-alloc volume data-path gate (Phase 5)
        run: go test -run TestClientZeroAllocGate -count=1 -v ./pkg/client/
