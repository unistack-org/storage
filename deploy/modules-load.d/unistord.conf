# Модули, нужные демону unistord для экспорта томов.
#
# Установка:
#   install -Dm644 deploy/modules-load.d/unistord.conf \
#     /usr/lib/modules-load.d/unistord.conf
#   systemctl restart systemd-modules-load.service
#   lsmod | grep -E 'vduse|vdpa'
#
# systemd-modules-load.service читает эти файлы на раннем boot, до
# unistord.service, и грузит модули от root — сам демон привилегий на
# modprobe не имеет (NoNewPrivileges=yes в unistord.service) и получать
# их не должен.
#
# vduse:         создаёт /dev/vduse/control (экспорт -vduse)
# vdpa:          рамка vDPA (нужна для `vdpa dev add`)
# virtio_vdpa:   драйвер virtio-blk поверх vDPA-устройства
# nbd:           клиент для -type nbd (open /dev/nbdN)

vduse
vdpa
virtio_vdpa
nbd
